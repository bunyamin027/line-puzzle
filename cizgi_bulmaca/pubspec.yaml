name: cizgi_bulmaca
description: "Çizgi Bulmaca — Parmağını kaldırmadan şekli tek çizgiyle tamamla!"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.4

  # Ads
  google_mobile_ads: ^5.3.0

  # In-App Purchase
  in_app_purchase: ^3.2.0

  # Audio & Haptics
  audioplayers: ^6.1.0

  # SVG Support
  flutter_svg: ^2.0.17

  # App Info
  package_info_plus: ^8.1.3

  # URL Launcher (privacy policy etc.)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/levels/

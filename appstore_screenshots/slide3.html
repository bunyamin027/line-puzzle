<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slide 3 — Seviye Haritası</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px;
    height: 2688px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
  }
  .frame {
    width: 1242px;
    height: 2688px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #2A1F5E 0%, #12101C 45%, #1E1B3A 100%);
  }
  .headline {
    position: absolute;
    top: 120px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .headline h2 {
    font-size: 76px;
    font-weight: 700;
    color: #fff;
    line-height: 1.12;
    text-shadow: 0 4px 40px rgba(224,64,251,0.3);
  }
  .headline h2 span {
    color: #E040FB;
  }
  .headline p {
    font-size: 38px;
    color: rgba(255,255,255,0.6);
    margin-top: 24px;
  }
  .phone-container {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
  }
  .phone-glow {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(224,64,251,0.2) 0%, transparent 70%);
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .phone-mockup {
    position: relative;
    z-index: 1;
    width: 100%;
    border-radius: 54px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 6px #2A2A4A, 0 0 0 8px rgba(224,64,251,0.3);
  }
  .phone-mockup img { width: 100%; display: block; }
  .deco { position: absolute; border-radius: 50%; opacity: 0.1; }
  .d1 { width: 350px; height: 350px; background: #E040FB; top: -120px; right: -120px; }
  .d2 { width: 250px; height: 250px; background: #FF5C5C; bottom: 500px; left: -80px; }
  .d3 { width: 180px; height: 180px; background: #FFC93C; top: 500px; left: 100px; opacity: 0.07; }
  /* Level count highlight */
  .level-badge {
    position: absolute;
    top: 450px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 20px;
  }
  .lbadge {
    padding: 16px 32px;
    border-radius: 20px;
    font-size: 30px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
  }
  .lbadge span { opacity: 0.6; }
</style>
</head>
<body>
<div class="frame">
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="deco d3"></div>
  <div class="headline">
    <h2>Her Seviye<br>Yeni Bir <span>Meydan Okuma</span></h2>
    <p>200 seviye × 3 zorluk modu</p>
  </div>
  <div class="level-badge">
    <div class="lbadge">🟢 <span>200</span> Kolay</div>
    <div class="lbadge">🟠 <span>200</span> Orta</div>
    <div class="lbadge">🟣 <span>200</span> Zor</div>
  </div>
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-mockup">
      <img src="IMG_1970.PNG" alt="Level Map">
    </div>
  </div>
</div>
</body>
</html>

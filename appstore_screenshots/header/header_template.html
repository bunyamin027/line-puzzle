<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Line Puzzle — App Store Header. Render: header.html?w=5244&h=2950&text=1 -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root { --purple:#6C4CF5; --mint:#3ADEB0; --yellow:#FFC93C; }
  html, body { margin:0; padding:0; overflow:hidden; background:#12101C; }
  #stage { position:relative; overflow:hidden; font-family:'Fredoka', sans-serif; color:#fff; }
  canvas { position:absolute; inset:0; }
  .copy { position:absolute; display:flex; flex-direction:column; justify-content:center; }
  .brand { display:flex; align-items:center; }
  .brand img { border-radius:22.5%; box-shadow:0 0 0.6em rgba(108,76,245,.65), 0 0.15em 0.4em rgba(0,0,0,.5); }
  h1, h2 { white-space:nowrap; }
  h1 { margin:0; font-weight:700; line-height:1; letter-spacing:-0.01em; }
  h2 { margin:0; font-weight:600; line-height:1.05;
       background:linear-gradient(90deg,#8F74FF,#3ADEB0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p  { margin:0; font-weight:500; color:rgba(255,255,255,.78); line-height:1.25; }
  .chips { display:flex; flex-wrap:wrap; }
  .chip { font-weight:600; color:#fff; border-radius:999px; white-space:nowrap; box-shadow:0 0.15em 0.5em rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="copy" id="copy">
    <div class="brand"><img id="icon" src="icon.png" alt=""><h1 id="title">Line Puzzle</h1></div>
    <h2 id="tag">Draw, Solve, Win</h2>
    <p id="sub">Connect every line in a single stroke.<br>1,200 levels · 4 difficulty modes</p>
    <div class="chips" id="chips">
      <span class="chip" style="background:linear-gradient(135deg,#3ADEB0,#2BC4A0)">Easy</span>
      <span class="chip" style="background:linear-gradient(135deg,#FFAA33,#FF8C00)">Medium</span>
      <span class="chip" style="background:linear-gradient(135deg,#E040FB,#FF5C5C)">Hard</span>
      <span class="chip" style="background:linear-gradient(135deg,#3D5AFE,#00C6FF)">Expert</span>
    </div>
  </div>
</div>
<script>
const LEVELS = __LEVELS__;
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 3840, H = +q.get('h') || 1646, TEXT = q.get('text') !== '0';
const HERO = q.get('hero') || '3_78';
const LANG = q.get('lang') === 'tr' ? 'tr' : 'en';
const COPY = {
  en: { title: 'Line Puzzle', tag: 'Draw, Solve, Win',
        sub: 'Connect every line in a single stroke.<br>1,200 levels · 4 difficulty modes',
        chips: ['Easy', 'Medium', 'Hard', 'Expert'] },
  tr: { title: 'Çizgi Bulmaca', tag: 'Çiz, Çöz, Kazan',
        sub: 'Tüm çizgileri tek hamlede birleştir.<br>1.200 seviye · 4 zorluk modu',
        chips: ['Kolay', 'Orta', 'Zor', 'Uzman'] },
}[LANG];
document.documentElement.lang = LANG;
document.getElementById('title').textContent = COPY.title;
document.getElementById('tag').textContent = COPY.tag;
document.getElementById('sub').innerHTML = COPY.sub;
document.querySelectorAll('.chip').forEach((c, i) => c.textContent = COPY.chips[i]);

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = H / 100;                        // 1 birim = yüksekliğin %1'i
const wide = W / H > 2;                   // 3840×1646 (2.33:1) mi, 5244×2950 (16:9) mı

// ─── Yerleşim (güvenli alan: kenarlardan %7 yatay, %12 dikey) ───
const padX = W * 0.07;
const copyW = TEXT ? (wide ? W * 0.36 : W / H > 1.7 ? W * 0.40 : W * 0.42) : 0;
const artX0 = TEXT ? padX + copyW + W * 0.02 : padX;
const artX1 = W - padX;

// ─── Arka plan ───
const bg = ctx.createLinearGradient(0, 0, W * 0.4, H);
bg.addColorStop(0, '#12101C'); bg.addColorStop(0.55, '#1E1B3A'); bg.addColorStop(1, '#2A1F5E');
ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
glow((artX0 + artX1) / 2, H * 0.5, H * 0.75, 'rgba(108,76,245,A)', 0.35);
glow(artX1 - H * 0.2, H * 0.85, H * 0.5, 'rgba(58,222,176,A)', 0.14);
glow(padX + H * 0.1, H * 0.1, H * 0.45, 'rgba(224,64,251,A)', 0.10);

// Nokta ızgarası (oyun tahtasıyla aynı doku)
ctx.fillStyle = 'rgba(255,255,255,0.055)';
const step = 2.6 * U;
for (let y = step / 2; y < H; y += step)
  for (let x = step / 2; x < W; x += step) { ctx.beginPath(); ctx.arc(x, y, 0.12 * U, 0, 7); ctx.fill(); }

// Uzak takımyıldız
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = Array.from({ length: 70 }, () => [rnd() * W, rnd() * H, 0.12 + rnd() * 0.22]);
ctx.lineWidth = 0.08 * U;
for (let i = 0; i < stars.length; i++) for (let j = i + 1; j < stars.length; j++) {
  const d = Math.hypot(stars[i][0] - stars[j][0], stars[i][1] - stars[j][1]);
  if (d < 14 * U) { ctx.strokeStyle = `rgba(255,255,255,${0.06 * (1 - d / (14 * U))})`;
    ctx.beginPath(); ctx.moveTo(stars[i][0], stars[i][1]); ctx.lineTo(stars[j][0], stars[j][1]); ctx.stroke(); }
}
stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(s[0], s[1], s[2] * U, 0, 7); ctx.fill(); });

// ─── Bulmaca çizimi (uygulamadaki GamePainter ile aynı görsel dil) ───
const lerp = (a, b, t) => a + (b - a) * t;
const C0 = [108, 76, 245], C1 = [58, 222, 176];
const pathColor = (i, n) => { const t = n <= 1 ? 1 : i / (n - 1);
  return `rgb(${C0.map((c, k) => Math.round(lerp(c, C1[k], t))).join(',')})`; };

function card(cx, cy, size, rot) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  const r = size * 0.09, s = size / 2;
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = size * 0.08; ctx.shadowOffsetY = size * 0.03;
  ctx.fillStyle = 'rgba(30,27,46,0.92)';
  ctx.beginPath(); ctx.roundRect(-s, -s, size, size, r); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = size * 0.006; ctx.stroke();
  ctx.restore();
}

/** progress: çizilen kenar oranı (0-1). Bitmiş bulmacada tüm düğümler parlak. */
function puzzle(level, cx, cy, size, rot, progress, scale = 1) {
  const sol = level.solution, n = sol.length - 1, drawnCount = Math.round(n * progress);
  const P = level.nodes.map(([x, y]) => [(x - 0.5) * size, (y - 0.5) * size]);
  const key = (a, b) => a < b ? a + '-' + b : b + '-' + a;
  const drawn = new Set(); for (let i = 0; i < drawnCount; i++) drawn.add(key(sol[i], sol[i + 1]));
  const visited = new Set(sol.slice(0, drawnCount + 1));
  const active = sol[drawnCount], done = drawnCount === n;
  const k = size / 100 * scale;           // çizgi kalınlığı ölçeği

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.lineCap = 'round';
  // Çizilmemiş kenarlar
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.1 * k;
  level.edges.forEach(([a, b]) => { if (!drawn.has(key(a, b))) {
    ctx.beginPath(); ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); ctx.stroke(); } });
  // Çizilmiş yol: ışıma + çekirdek
  for (const pass of [0, 1]) for (let i = 0; i < drawnCount; i++) {
    const a = P[sol[i]], b = P[sol[i + 1]], col = pathColor(i, n);
    ctx.strokeStyle = col;
    if (pass === 0) { ctx.globalAlpha = 0.55; ctx.lineWidth = 3.6 * k; ctx.filter = `blur(${1.8 * k}px)`; }
    else { ctx.globalAlpha = 1; ctx.lineWidth = 1.7 * k; ctx.filter = 'none'; }
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.filter = 'none';
  // Düğümler
  const nr = 3.4 * k;
  P.forEach((p, i) => {
    const isActive = i === active && !done, isVisited = visited.has(i) || done;
    if (isActive) {
      ctx.fillStyle = 'rgba(108,76,245,0.25)'; ctx.beginPath(); ctx.arc(...p, nr * 2.3, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,201,60,0.7)'; ctx.lineWidth = 0.6 * k;
      ctx.beginPath(); ctx.arc(...p, nr * 3.1, 0, 7); ctx.stroke();
    }
    const fill = isActive ? '#6C4CF5' : isVisited ? '#3ADEB0' : '#4A4763';
    if (isVisited || isActive) { ctx.filter = `blur(${1.5 * k}px)`; ctx.fillStyle = fill;
      ctx.beginPath(); ctx.arc(...p, nr * 1.25, 0, 7); ctx.fill(); ctx.filter = 'none'; }
    const r = isActive ? nr * 1.2 : nr;
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(...p, r, 0, 7); ctx.fill();
    ctx.fillStyle = isVisited || isActive ? '#fff' : '#1E1B2E'; ctx.beginPath(); ctx.arc(...p, r * 0.48, 0, 7); ctx.fill();
  });
  // Parmak ucu: aktif düğümden bir sonraki düğüme doğru uzanan çizgi + ışık
  if (!done) {
    const a = P[active], b = P[sol[drawnCount + 1]], t = 0.55;
    const tip = [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
    ctx.strokeStyle = pathColor(drawnCount, n); ctx.globalAlpha = 0.8; ctx.lineWidth = 1.4 * k;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...tip); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.filter = `blur(${2 * k}px)`; ctx.fillStyle = 'rgba(255,201,60,0.8)';
    ctx.beginPath(); ctx.arc(...tip, 3 * k, 0, 7); ctx.fill(); ctx.filter = 'none';
    ctx.fillStyle = '#FFC93C'; ctx.beginPath(); ctx.arc(...tip, 1.3 * k, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ─── Sahne: ortada büyük Uzman bulmacası, iki yanda küçük kartlar ───
const artW = artX1 - artX0, artCX = (artX0 + artX1) / 2;
const heroSize = Math.min(H * (wide ? 0.80 : 0.66), artW * 0.52);
const smallSize = heroSize * 0.46;
const sideGap = heroSize * 0.5 + smallSize * 0.62;

card(artCX - sideGap, H * 0.36, smallSize, -0.10);
puzzle(LEVELS['0_11'], artCX - sideGap, H * 0.36, smallSize * 0.80, -0.10, 1, 1.15);
card(artCX + sideGap, H * 0.64, smallSize, 0.09);
puzzle(LEVELS['2_57'], artCX + sideGap, H * 0.64, smallSize * 0.82, 0.09, 1, 1.15);
if (!wide) {   // 16:9'da dikey boşluk fazla: üçüncü kart
  card(artCX + sideGap * 0.86, H * 0.22, smallSize * 0.78, -0.06);
  puzzle(LEVELS['1_90'], artCX + sideGap * 0.86, H * 0.22, smallSize * 0.62, -0.06, 0.55, 1.1);
}
card(artCX, H * 0.5, heroSize, 0);
puzzle(LEVELS[HERO], artCX, H * 0.5, heroSize * 0.84, 0, 0.7, 0.75);

// ─── Metin bloğu (font yüksekliğe göre ölçeklenir) ───
const copy = document.getElementById('copy');
if (!TEXT) copy.remove(); else {
  // 3:2'de metin bloğu daha dar: "Line Puzzle" tek satırda kalsın
  const f = wide ? 1 : W / H > 1.7 ? 0.82 : 0.68;
  Object.assign(copy.style, { left: padX + 'px', top: H * 0.12 + 'px', width: copyW + 'px', height: H * 0.76 + 'px', gap: 3.2 * U * f + 'px' });
  const icon = document.getElementById('icon'); icon.style.width = icon.style.height = 13 * U * f + 'px';
  document.querySelector('.brand').style.gap = 3 * U * f + 'px';
  document.getElementById('title').style.fontSize = 12.5 * U * f + 'px';
  document.getElementById('tag').style.fontSize = 8.6 * U * f + 'px';
  document.getElementById('sub').style.fontSize = 4.1 * U * f + 'px';
  const chips = document.getElementById('chips'); chips.style.gap = 1.4 * U * f + 'px';
  document.querySelectorAll('.chip').forEach(c => { c.style.fontSize = 3.3 * U * f + 'px'; c.style.padding = `${0.9 * U * f}px ${2.4 * U * f}px`; });
}
// Başlık satırı metin alanına sığmazsa tüm metin bloğunu orantılı küçült
document.fonts.ready.then(() => {
  if (TEXT) {
    const brand = document.querySelector('.brand');
    // Sağda pay bırak: döndürülmüş sol kart metin alanına biraz taşar
    const maxW = copyW * 0.86;
    const scale = Math.min(1, maxW / brand.scrollWidth, maxW / document.getElementById('tag').scrollWidth);
    if (scale < 1) copy.querySelectorAll('h1, h2, p, .chip').forEach(el => {
      el.style.fontSize = parseFloat(el.style.fontSize) * scale + 'px';
    });
    if (scale < 1) { const icon = document.getElementById('icon');
      icon.style.width = icon.style.height = parseFloat(icon.style.width) * scale + 'px'; }
  }
  document.body.setAttribute('data-ready', '1');
});
</script>
</body>
</html>

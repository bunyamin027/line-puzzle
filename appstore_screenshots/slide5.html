<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slide 5 — Başlangıç</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px;
    height: 2688px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
  }
  .frame {
    width: 1242px;
    height: 2688px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #12101C 0%, #1A1040 40%, #6C4CF5 100%);
  }
  .headline {
    position: absolute;
    top: 120px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .headline h2 {
    font-size: 78px;
    font-weight: 700;
    color: #fff;
    line-height: 1.12;
    text-shadow: 0 4px 40px rgba(108,76,245,0.4);
  }
  .headline h2 span {
    background: linear-gradient(135deg, #FFC93C, #FF6B35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .headline p {
    font-size: 38px;
    color: rgba(255,255,255,0.6);
    margin-top: 24px;
  }
  .features-row {
    position: absolute;
    top: 460px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 10;
  }
  .feature {
    text-align: center;
    background: rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 24px 28px;
    border: 1.5px solid rgba(255,255,255,0.1);
    min-width: 200px;
  }
  .feature .icon { font-size: 40px; margin-bottom: 10px; }
  .feature .text {
    font-size: 24px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  .phone-container {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
  }
  .phone-glow {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(108,76,245,0.25) 0%, transparent 70%);
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .phone-mockup {
    position: relative;
    z-index: 1;
    width: 100%;
    border-radius: 54px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 6px #2A2A4A, 0 0 0 8px rgba(108,76,245,0.3);
  }
  .phone-mockup img { width: 100%; display: block; }
  .deco { position: absolute; border-radius: 50%; opacity: 0.1; }
  .d1 { width: 350px; height: 350px; background: #6C4CF5; top: -120px; left: -120px; }
  .d2 { width: 250px; height: 250px; background: #FFC93C; bottom: 500px; right: -80px; }
  .d3 { width: 180px; height: 180px; background: #3ADEB0; top: 350px; left: 100px; opacity: 0.07; }
</style>
</head>
<body>
<div class="frame">
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="deco d3"></div>
  <div class="headline">
    <h2>Kolay Başla<br><span>Ustalaş!</span></h2>
    <p>Sezgisel oynanış, anında başla</p>
  </div>
  <div class="features-row">
    <div class="feature">
      <div class="icon">👆</div>
      <div class="text">Tek Parmak<br>Kontrolü</div>
    </div>
    <div class="feature">
      <div class="icon">🧩</div>
      <div class="text">Sezgisel<br>Tasarım</div>
    </div>
    <div class="feature">
      <div class="icon">🚀</div>
      <div class="text">Hemen<br>Oyna</div>
    </div>
  </div>
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-mockup">
      <img src="IMG_1965.PNG" alt="Onboarding">
    </div>
  </div>
</div>
</body>
</html>

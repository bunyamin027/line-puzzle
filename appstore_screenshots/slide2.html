<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slide 2 — Ana Ekran</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px;
    height: 2688px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
  }
  .frame {
    width: 1242px;
    height: 2688px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #0A2B27 0%, #12101C 45%, #1E1B3A 100%);
  }
  .headline {
    position: absolute;
    top: 120px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .headline h2 {
    font-size: 78px;
    font-weight: 700;
    color: #fff;
    line-height: 1.12;
    text-shadow: 0 4px 40px rgba(58,222,176,0.4);
  }
  .headline h2 span {
    color: #3ADEB0;
  }
  .headline p {
    font-size: 38px;
    color: rgba(255,255,255,0.6);
    margin-top: 24px;
  }
  .badge-row {
    position: absolute;
    top: 470px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    z-index: 10;
  }
  .badge {
    padding: 18px 38px;
    border-radius: 34px;
    font-size: 32px;
    font-weight: 600;
    color: #fff;
  }
  .badge-easy { background: rgba(58,222,176,0.2); border: 2px solid rgba(58,222,176,0.5); }
  .badge-medium { background: rgba(255,170,51,0.2); border: 2px solid rgba(255,170,51,0.5); }
  .badge-hard { background: rgba(224,64,251,0.2); border: 2px solid rgba(224,64,251,0.5); }
  .phone-container {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
  }
  .phone-glow {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(58,222,176,0.2) 0%, transparent 70%);
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .phone-mockup {
    position: relative;
    z-index: 1;
    width: 100%;
    border-radius: 54px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 6px #1A3A35, 0 0 0 8px rgba(58,222,176,0.3);
  }
  .phone-mockup img { width: 100%; display: block; }
  .deco { position: absolute; border-radius: 50%; opacity: 0.1; }
  .d1 { width: 350px; height: 350px; background: #3ADEB0; top: -120px; right: -120px; }
  .d2 { width: 250px; height: 250px; background: #FFAA33; bottom: 600px; left: -80px; }
  .d3 { width: 180px; height: 180px; background: #E040FB; top: 350px; right: -50px; opacity: 0.07; }
</style>
</head>
<body>
<div class="frame">
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="deco d3"></div>
  <div class="headline">
    <h2><span>600+</span> Seviye<br>Seni Bekliyor!</h2>
    <p>Kolay · Orta · Zor modları keşfet</p>
  </div>
  <div class="badge-row">
    <div class="badge badge-easy">😊 Kolay</div>
    <div class="badge badge-medium">🔧 Orta</div>
    <div class="badge badge-hard">🔥 Zor</div>
  </div>
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-mockup">
      <img src="IMG_1968.PNG" alt="Home Screen">
    </div>
  </div>
</div>
</body>
</html>
